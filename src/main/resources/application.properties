# Kết nối SQL Server (Thay đổi username/password tương ứng với SQL Server của bạn)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=graphql_db;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Dialect cho SQL Server
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Bật công cụ GraphiQL để test API trực quan
spring.graphql.graphiql.enabled=true